# Локальный Postgres только для тестов.
# Прод и разработка ходят в Neon; тестам нужна своя пустая база, которую не жалко
# пересоздавать (tests/db.js делает sync({ force: true }) перед каждым файлом).
#
#   npm run test:db:up    — поднять
#   npm test              — прогнать тесты
#   npm run test:db:down  — погасить (данные не сохраняются, том не создаётся)
services:
  postgres-test:
    image: postgres:16
    container_name: diklario-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polish_test
    ports:
      - '5433:5432' # 5433, чтобы не конфликтовать с локальным Postgres на 5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d polish_test']
      interval: 3s
      timeout: 3s
      retries: 10
